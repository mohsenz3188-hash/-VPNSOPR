name: Restore structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild project from the zip
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name VPNSOPR-FULL-SOURCE.zip -exec rm -rf {} +
          unzip -q VPNSOPR-FULL-SOURCE.zip -x 'VPNSOPR/.github/workflows/*'
          cp -a VPNSOPR/. .
          rm -rf VPNSOPR VPNSOPR-FULL-SOURCE.zip

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f -A
          git commit -m "Restore full project structure"
          git push
